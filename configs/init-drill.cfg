# init-drill.cfg - generated from configs/system.toml (docs/service-manager.md) - do not edit.

# Minimal topology for the BOOT_TEST supervision drill
# (tools/check_fault_handler.py): the drill exercises the console crash,
# the logger rebuild and the level-1 init restart. The data services
# (block/fs/gpu/mysh) do not participate; excluding them keeps the drill's
# restart cycles free of their no-device failure loops.

service console {
    elf = "console.elf"
    device = "uart0"
    restart = always
}
