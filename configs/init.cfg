# init.cfg - generated from configs/system.toml (docs/service-manager.md) - do not edit.

service console {
    elf = "console.elf"
    device = "uart0"
    restart = always
}

service block {
    elf = "block.elf"
    depends = console
    device = "virtio-mmio-0"
    restart = on-failure
    budget = "1M"
}

service fs {
    elf = "fs.elf"
    depends = block gpu
    restart = on-failure
    budget = "2M"
}

# gpu-server: the sixth service (docs/gui-display.md §3). It drives
# virtio-gpu *and* virtio-keyboard in one window: two device grants, two IRQ
# handlers (init authorizes one per device, in order). 2M = 512 pages covers
# the 300-page 1.2 MiB framebuffer plus queue rings and the covering table;
# a second 4M budget would not fit init's own grant next to mysh's.
service gpu {
    elf = "gpu.elf"
    depends = console block
    device = "virtio-mmio-1"
    device = "virtio-mmio-2"
    restart = on-failure
    budget = "2M"
}

# mysh: interactive shell. Prompts on the console and runs commands
# (`ls`, `cat <file>`, `./hello`, `help`, `exit`); `./hello` loads hello
# from the disk. The appmgr service is not part of the default topology —
# the shell runs apps on demand; the D3/D5 acceptances use the appmgr
# profile. The budget now also covers the shell's own heap growth (C0: the
# allocator retypes from this task's budget) plus the 1 MiB per-child
# sub-Untyped and disk app images up to 512 KiB (debug builds). The gpu
# dependency only feeds the `./gui` capability grant: the shell never talks
# to it itself.
service mysh {
    elf = "mysh.elf"
    depends = fs gpu
    restart = never
    budget = "4M"
}
