# init.cfg - service manifest (see docs/service-manager.md, docs/disk-driver.md)
service console {
    elf = "console.elf"
    device = uart0
    restart = always
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
}

service block {
    elf = "block.elf"
    depends = console
    device = virtio-mmio-0
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 1M
}

service fs {
    elf = "fs.elf"
    depends = block
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 2M
}

# mysh: interactive shell. Prompts on the console and runs commands
# (`ls`, `cat <file>`, `./hello`, `help`, `exit`); `./hello` loads hello
# from the disk. The appmgr service is not part of the default topology — the
# shell runs apps on demand; the D3/D5 acceptances use apps/init-appmgr.cfg.
# The budget now also covers the shell's own heap growth (C0: the allocator
# retypes from this task's budget) plus the 1 MiB per-child sub-Untyped and
# disk app images up to 512 KiB (debug builds).
service mysh {
    elf = "mysh.elf"
    depends = fs
    restart = never
    budget = 4M
}
