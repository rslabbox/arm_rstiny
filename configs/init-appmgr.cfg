# init.cfg - service manifest (see docs/service-manager.md, docs/disk-driver.md)
service console {
    elf = "console.elf"
    device = uart0
    restart = always
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
}

service block {
    elf = "block.elf"
    depends = console
    device = virtio-mmio-0
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 1M
}

service fs {
    elf = "fs.elf"
    depends = block
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 2M
}

service appmgr {
    elf = "appmgr.elf"
    depends = fs
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 2M
}

