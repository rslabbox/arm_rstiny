# init-appmgr.cfg - generated from configs/system.toml (docs/service-manager.md) - do not edit.

service console {
    elf = "console.elf"
    device = "uart0"
    restart = always
}

service block {
    elf = "block.elf"
    depends = console
    device = "virtio-mmio-0"
    restart = on-failure
    budget = "1M"
}

service fs {
    elf = "fs.elf"
    depends = block
    restart = on-failure
    budget = "2M"
}

# The budget also covers appmgr's own heap growth (C0: the allocator retypes from this task's budget): it reads app images up to 512 KiB into memory.
service appmgr {
    elf = "appmgr.elf"
    depends = fs
    restart = on-failure
    budget = "4M"
}
