# init.cfg - service manifest (see docs/service-manager.md, docs/disk-driver.md)
service console {
    elf = "console.elf"
    device = uart0
    restart = always
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
}

service block {
    elf = "block.elf"
    depends = console
    device = virtio-mmio-0
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 1M
}

service fs {
    elf = "fs.elf"
    depends = block
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 2M
}

service appmgr {
    elf = "appmgr.elf"
    depends = fs
    restart = on-failure
    max_restarts = 5
    window_ms = 60000
    backoff_ms = 100
    budget = 2M
}

# mysh: script-driven shell (apps/SH.CFG on the disk). Runs once; it lists the
# disk, cats files and executes ./hello by loading HELLO.ELF from the disk.
service mysh {
    elf = "mysh.elf"
    depends = fs
    restart = never
    budget = 2M
}
