# APPS.CFG - application manifest read by appmgr from the FAT32 disk
# (docs/disk-driver.md section 10). Syntax matches init.cfg.
#
# The default manifest is empty: the interactive shell (mysh) runs
# hello on demand with `./hello`. The D3/D5 acceptances use
# apps/APPS-hello.CFG (Makefile APPS_CFG=...), which lists the app.
