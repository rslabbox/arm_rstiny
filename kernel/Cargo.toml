[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Kernel-test images exercise the address-space helpers through the managed
# wrappers, so they imply the transitional feature.
kernel-test = ["managed-runtime"]
# Transitional managed-task services (Runtime::Create/Start/Status/Wait/
# Destroy/DestroyThread/Cspace/Vspace/FindEmptySlot/Map). Production images
# compile them out: userland is loader-based and every remaining Runtime
# method is informational or a self-/cap-checked restricted primitive
# (docs/capability-authority-untyped.md §4, C3). Only the managed-API
# regression harnesses (check_tasks/check_fpu/check_ipc/check_irq) need this.
managed-runtime = []

[dependencies]
log = "0.4"
bitflags = "2.9.1"
aarch64-cpu = "11.2.0"
arm-gic-driver = "0.17.13"
memory_addr = "0.4"
linked_list_allocator = { version = "0.10", default-features = false }
tock-registers = "0.10.1"
kernel-abi = { path = "../projects/libs/abi" }
